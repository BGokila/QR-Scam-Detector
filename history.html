<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Shield | Cloud Scan History</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <h2 class="logo">🛡 QR Shield</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#scanner">Scanner</a></li>
            </ul>
        </nav>
    </header>

    <h1 style="text-align:center; color:#00ff99; margin-top:30px;">Your Cloud History</h1>

    <div class="history-controls">
        <input type="text" id="searchInput" placeholder="Search scanned links...">
        <div class="filter-btns">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="safe">Safe</button>
            <button class="filter-btn" data-filter="suspicious">Suspicious</button>
            <button class="filter-btn" data-filter="dangerous">Dangerous</button>
        </div>
    </div>

    <div id="history"></div>

    <div style="text-align:center; margin-bottom: 40px;">
        <button id="clearBtn">Clear My Cloud History</button>
    </div>

    <script type="module">
        import { loadFirebaseHistory, clearFirebaseHistory } from './firebase.js';

        const historyBox = document.getElementById("history");
        const searchInput = document.getElementById("searchInput");
        const filterBtns = document.querySelectorAll(".filter-btn");

        let allItems = [];
        let currentFilter = "all";

        function riskBucket(risk) {
            if (risk >= 70) return "dangerous";
            if (risk >= 30) return "suspicious";
            return "safe";
        }

        function render() {
            const query = searchInput.value.trim().toLowerCase();
            const filtered = allItems.filter(item => {
                const matchesFilter = currentFilter === "all" || riskBucket(item.risk || 0) === currentFilter;
                const matchesSearch = !query || (item.url || "").toLowerCase().includes(query);
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                historyBox.innerHTML = "<p style='color: white; text-align:center;'>No matching scans found.</p>";
                return;
            }

            historyBox.innerHTML = filtered.map(item => {
                const bucket = riskBucket(item.risk || 0);
                const color = bucket === "dangerous" ? "red" : (bucket === "suspicious" ? "orange" : "#00ff99");
                return `
                    <div class="history-card" style="border-left: 5px solid ${color};">
                        <h3>${item.url}</h3>
                        <p style="color: ${color}; margin-top: 5px;">
                           Risk Score: ${item.risk || 0}% | ${item.date}
                        </p>
                    </div>
                `;
            }).join("");
        }

        loadFirebaseHistory((data) => {
            if (!data) {
                allItems = [];
                render();
                return;
            }
            allItems = Object.keys(data).reverse().map(key => data[key]);
            render();
        });

        searchInput.oninput = render;
        filterBtns.forEach(btn => {
            btn.onclick = () => {
                filterBtns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentFilter = btn.dataset.filter;
                render();
            };
        });

        document.getElementById("clearBtn").onclick = () => {
            clearFirebaseHistory();
            localStorage.removeItem("scanHistory");
            alert("Your Cloud History Cleared!");
        };
    </script>
</body>
</html>
